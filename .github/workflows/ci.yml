name: CI

on:
  push:
  pull_request:

env:
  DOTNET_VERSION: "9.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  # En cada push y PR, objetivo <2 min: build en Release sin warnings + solo tests unitarios.
  # Los de integración (Testcontainers, varios minutos) van en el job de abajo.
  build-and-unit-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore FlashQueue.sln

      - name: Build (Release, sin warnings)
        run: dotnet build FlashQueue.sln -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Unit tests
        run: >
          dotnet test tests/FlashQueue.Tests.Unit/FlashQueue.Tests.Unit.csproj
          -c Release --no-build --no-restore
          --logger "console;verbosity=normal"

  # Solo en push a main y en PRs, no en cada commit de una rama de feature: Testcontainers levanta
  # Postgres y RabbitMQ reales (varios minutos). ubuntu-latest ya trae Docker, sin setup adicional.
  integration-test:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore FlashQueue.sln

      - name: Build (Release)
        run: dotnet build FlashQueue.sln -c Release --no-restore

      - name: Verify Docker is available
        run: docker info

      - name: Integration tests
        run: >
          dotnet test tests/FlashQueue.Tests.Integration/FlashQueue.Tests.Integration.csproj
          -c Release --no-build --no-restore
          --logger "console;verbosity=normal"
