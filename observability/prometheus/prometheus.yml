# Las métricas de FlashQueue llegan por remote-write desde el Collector, no por scraping — por
# eso no hay scrape_configs para la app. Se deja el self-scrape de Prometheus por si hace falta depurarlo.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
