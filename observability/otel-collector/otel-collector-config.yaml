# Punto de entrada único de OTLP para toda la app (endpoint configurable en cada servicio,
# Observability:OtlpEndpoint). Reparte cada señal a donde sabe entenderla: Tempo solo habla OTLP
# de trazas, Prometheus solo acepta métricas por remote-write — ver
# docs/adr/0006-opentelemetry-collector-como-fan-out.md.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
  debug:
    verbosity: basic

# Sin healthcheck de Docker propio (la imagen otel/opentelemetry-collector-contrib no trae shell
# ni curl/wget para ejecutar uno), pero esta extensión sí sirve para comprobar el estado a mano:
# curl http://localhost:13133 desde fuera del contenedor.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheusremotewrite, debug]
