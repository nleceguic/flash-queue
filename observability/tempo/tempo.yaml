# Config mínima de Tempo: solo recibe OTLP (del OpenTelemetry Collector, no directamente de la
# app — ver docs/adr/0006-opentelemetry-collector-como-fan-out.md) y guarda en disco local.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
